packages:
  - "apps/*"
  - "packages/*"

# pnpm 10+ does not run dependency build scripts unless they are approved here.
# Both of these genuinely need theirs: esbuild links its platform binary (vite,
# storybook and the showcase all fail without it) and sharp builds the native
# image pipeline Astro uses for the docs site.
allowBuilds:
  esbuild: true
  sharp: true
